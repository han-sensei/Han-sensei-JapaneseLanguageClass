<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>누가누가 빠를까? 일본어 글자 짝 맞추기!</title>
  
  <!-- 폰트 불러오기 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #FFF9E6;
      --card-jp-bg: #E3F2FD;
      --card-jp-border: #90CAF9;
      --card-kr-bg: #FFF0F5;
      --card-kr-border: #FFB6C1;
      --card-selected: #FFE082;
      --card-matched: #C8E6C9;
      --primary-color: #FF8C00;
      --secondary-color: #4D96FF;
      --accent-color: #FFD93D;
      --text-color: #2D3436;
      --shadow-color: rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      font-family: 'Jua', 'Nanum Gothic', sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      background-image: radial-gradient(#FFECB3 2px, transparent 2px);
      background-size: 24px 24px;
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    .main-container {
      width: 100%;
      max-width: 500px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.4s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .game-title {
      font-size: 2.6rem;
      color: var(--primary-color);
      text-shadow: 3px 3px 0px #FFF, 6px 6px 0px var(--accent-color);
      margin: 0 0 25px 0;
      text-align: center;
      letter-spacing: 1px;
      line-height: 1.3;
      word-break: keep-all;
    }

    .menu-card {
      background: white;
      padding: 35px 25px;
      border-radius: 28px;
      box-shadow: 0 10px 25px var(--shadow-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      width: 100%;
      border: 4px solid #FFECB3;
    }

    .menu-label {
      font-size: 1.2rem;
      color: #666;
      margin-bottom: 5px;
    }

    /* 버튼 공통 스타일 */
    .btn {
      width: 100%;
      padding: 16px 20px;
      font-size: 1.5rem;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      transition: all 0.1s ease;
      color: white;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .btn:active {
      transform: translateY(4px);
    }

    /* 1. 히라가나 버튼 (#FF6B81) */
    .btn-hiragana {
      background-color: #FF6B81;
      box-shadow: 0 6px 0px #D63031;
    }
    .btn-hiragana:active {
      box-shadow: 0 2px 0px #D63031;
    }

    /* 2. 가타카나 버튼 (#16A34A) */
    .btn-katakana {
      background-color: #16A34A;
      box-shadow: 0 6px 0px #15803D;
    }
    .btn-katakana:active {
      box-shadow: 0 2px 0px #15803D;
    }

    /* 3. ??? 버튼 (검정에 가까운 톤 #2D3436) */
    .btn-secret {
      background-color: #2D3436;
      box-shadow: 0 6px 0px #18181B;
    }
    .btn-secret:active {
      box-shadow: 0 2px 0px #18181B;
    }

    .watermark-footer {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      font-weight: 600;
      color: rgba(45, 52, 54, 0.25);
      pointer-events: none;
      user-select: none;
      z-index: 9999;
      letter-spacing: 1px;
    }

    @media (max-width: 600px) {
      .game-title { font-size: 2.1rem; }
      .btn { font-size: 1.3rem; padding: 14px 18px; }
      .menu-card { padding: 25px 20px; }
    }
  </style>
</head>
<body>

  <main class="main-container">
    <h1 class="game-title">누가누가 빠를까?<br>일본어 글자 짝 맞추기!</h1>

    <div class="menu-card">
      <span class="menu-label">게임 모드를 선택하세요</span>

      <!-- 히라가나 버튼 -->
      <a href="https://han-sensei.github.io/Han-sensei-JapaneseLanguageClass/hiragana_matching_game.html" class="btn btn-hiragana">
        あ 히라가나
      </a>

      <!-- 가타카나 버튼 -->
      <a href="https://han-sensei.github.io/Han-sensei-JapaneseLanguageClass/katakana_matching_game.html" class="btn btn-katakana">
        ア 가타카나
      </a>

      <!-- ??? 버튼 -->
      <a href="https://han-sensei.github.io/Han-sensei-JapaneseLanguageClass/mix_matching_game.html" class="btn btn-secret">
        ???
      </a>
    </div>
  </main>

  <footer class="watermark-footer">
    Made by ハン先生
  </footer>

</body>
</html>
